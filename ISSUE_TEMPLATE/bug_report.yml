name: Bug report
description: Report a reproducible problem with a FloriaApps project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please provide enough information for us to reproduce and investigate the problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
      placeholder: Tell us what happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the steps required to reproduce the problem.
      placeholder: |
        1. Start the application
        2. Open...
        3. Click...
        4. The problem occurs
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.2.0

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Fedora 43, Windows 11, Android 16

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Include relevant logs or error messages. Remove sensitive information.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other information that may help us investigate the issue.